<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Gemini Atlas</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #ffffff;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #gemini-atlas-svg {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>

<body>
  <object
    id="gemini-atlas-svg"
    type="image/svg+xml"
    data="gemini.atlas.svg"
    aria-label="Gemini Atlas"
  >
    Your browser does not support SVG files.
  </object>

  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>

  <script>
    (function () {
      "use strict";

      var svgObject = document.getElementById("gemini-atlas-svg");
      var panZoomInstance = null;
      var resizeTimer = null;
      var currentMode = null;
      var lastViewportWidth = window.innerWidth;

      var OPENING_VIEWS = {
        /*
         * Desktop remains unchanged.
         */
        desktop: {
          zoom: 3.0,
          panX: 0.26,
          panY: 0.86
        },

        /*
         * Mobile:
         * Centers Decision Narrative and removes
         * the exposed white space above the SVG.
         */
        mobile: {
          zoom: 5.6,
          panX: 0.78,
          panY: 0.58
        }
      };

      function getLayoutMode() {
        var narrowScreen = window.innerWidth <= 768;

        var coarsePointer =
          window.matchMedia &&
          window.matchMedia("(pointer: coarse)").matches;

        var mobileSizedTouchscreen =
          coarsePointer &&
          Math.min(window.innerWidth, window.innerHeight) <= 900;

        return narrowScreen || mobileSizedTouchscreen
          ? "mobile"
          : "desktop";
      }

      function prepareEmbeddedSvg() {
        if (
          !svgObject.contentDocument ||
          !svgObject.contentDocument.documentElement
        ) {
          return;
        }

        var svgRoot = svgObject.contentDocument.documentElement;

        svgRoot.style.touchAction = "none";
        svgRoot.style.overscrollBehavior = "none";
        svgRoot.style.userSelect = "none";
        svgRoot.style.webkitUserSelect = "none";
      }

      function createMobileEventsHandler() {
        return {
          haltEventListeners: [
            "touchstart",
            "touchend",
            "touchmove",
            "touchleave",
            "touchcancel"
          ],

          init: function (options) {
            var instance = options.instance;
            var initialScale = 1;
            var previousDeltaX = 0;
            var previousDeltaY = 0;

            this.hammer = new Hammer.Manager(options.svgElement, {
              touchAction: "none"
            });

            var panRecognizer = new Hammer.Pan({
              threshold: 0,
              pointers: 0
            });

            var pinchRecognizer = new Hammer.Pinch({
              threshold: 0
            });

            pinchRecognizer.recognizeWith(panRecognizer);

            this.hammer.add([
              panRecognizer,
              pinchRecognizer
            ]);

            this.hammer.on("panstart", function (event) {
              previousDeltaX = 0;
              previousDeltaY = 0;

              if (event.srcEvent) {
                event.srcEvent.preventDefault();
              }
            });

            this.hammer.on("panmove", function (event) {
              instance.panBy({
                x: event.deltaX - previousDeltaX,
                y: event.deltaY - previousDeltaY
              });

              previousDeltaX = event.deltaX;
              previousDeltaY = event.deltaY;

              if (event.srcEvent) {
                event.srcEvent.preventDefault();
              }
            });

            this.hammer.on("pinchstart", function (event) {
              initialScale = instance.getZoom();

              if (event.srcEvent) {
                event.srcEvent.preventDefault();
              }
            });

            this.hammer.on("pinchmove", function (event) {
              instance.zoomAtPoint(
                initialScale * event.scale,
                {
                  x: event.center.x,
                  y: event.center.y
                }
              );

              if (event.srcEvent) {
                event.srcEvent.preventDefault();
              }
            });
          },

          destroy: function () {
            if (this.hammer) {
              this.hammer.destroy();
              this.hammer = null;
            }
          }
        };
      }

      function applyOpeningView() {
        if (!panZoomInstance) {
          return;
        }

        currentMode = getLayoutMode();
        lastViewportWidth = window.innerWidth;

        var view = OPENING_VIEWS[currentMode];

        panZoomInstance.resize();
        panZoomInstance.fit();
        panZoomInstance.center();
        panZoomInstance.zoom(view.zoom);

        var sizes = panZoomInstance.getSizes();

        panZoomInstance.panBy({
          x: sizes.width * view.panX,
          y: sizes.height * view.panY
        });
      }

      function initializeGeminiAtlas() {
        if (panZoomInstance) {
          return;
        }

        prepareEmbeddedSvg();

        currentMode = getLayoutMode();
        lastViewportWidth = window.innerWidth;

        var isMobile = currentMode === "mobile";

        var options = {
          panEnabled: true,
          zoomEnabled: true,
          controlIconsEnabled: true,
          dblClickZoomEnabled: !isMobile,
          mouseWheelZoomEnabled: true,
          preventMouseEventsDefault: true,
          zoomScaleSensitivity: isMobile ? 0.25 : 0.20,
          fit: true,
          center: true,
          contain: false,
          minZoom: 0.5,
          maxZoom: 20,
          refreshRate: "auto"
        };

        if (isMobile && window.Hammer) {
          options.customEventsHandler =
            createMobileEventsHandler();
        }

        panZoomInstance = svgPanZoom(
          svgObject,
          options
        );

        window.requestAnimationFrame(function () {
          window.requestAnimationFrame(
            applyOpeningView
          );
        });
      }

      function handleViewportResize() {
        window.clearTimeout(resizeTimer);

        resizeTimer = window.setTimeout(function () {
          if (!panZoomInstance) {
            return;
          }

          var newMode = getLayoutMode();
          var newWidth = window.innerWidth;

          var modeChanged =
            newMode !== currentMode;

          var substantialWidthChange =
            Math.abs(
              newWidth - lastViewportWidth
            ) > 80;

          /*
           * Height-only changes from Chrome's address bar
           * will resize the surface without resetting the view.
           */
          panZoomInstance.resize();

          if (
            modeChanged ||
            substantialWidthChange
          ) {
            applyOpeningView();
          }
        }, 160);
      }

      svgObject.addEventListener(
        "load",
        initializeGeminiAtlas
      );

      if (
        svgObject.contentDocument &&
        svgObject.contentDocument.documentElement
      ) {
        initializeGeminiAtlas();
      }

      window.addEventListener(
        "resize",
        handleViewportResize,
        { passive: true }
      );
    })();
  </script>
</body>
</html>
